<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OntoDL+</title>
  <script>
    (function () {
      var langs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || navigator.userLanguage || "en"];
      var portuguese = langs.some(function (tag) {
        return String(tag).toLowerCase().split("-")[0] === "pt";
      });
      window.location.replace(portuguese ? "/pt/" : "/en/");
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/en/">
  </noscript>
</head>
<body>
  <p><a href="/pt/">Português</a> · <a href="/en/">English</a></p>
</body>
</html>
